<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nagaland Lottery Results - Today's Draw</title>
  <meta name="description" content="Check the latest official Nagaland State Lottery results for the morning, day, and evening draws.">
  <script src="https://cdn.tailwindcss.com/3.4.4"></script>
  <style>
    /* Custom style for result numbers for better readability */
    .result-number {
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="bg-white shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-800">
        <a href="/">Nagaland Lottery Results</a>
      </h1>
      <nav>
        <a href="/" class="px-4 py-2 rounded-lg hover:bg-gray-100 text-base md:text-lg font-medium">Home</a>
        <a href="/archive.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 text-base md:text-lg font-medium">Archive</a>
        <a href="/contact.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 text-base md:text-lg font-medium">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">
    <section class="text-center mb-8">
      <h2 id="results-date" class="text-2xl md:text-3xl font-bold text-gray-900">Today's Results</h2>
      <p class="text-base md:text-lg text-gray-600 mt-1">Official Sambad Lottery Results</p>
    </section>

    <section class="bg-white rounded-2xl shadow-md p-4 mb-4">
      <table class="w-full border-collapse">
        <thead class="border-b-2 border-gray-200">
          <tr>
            <th class="text-left py-3 px-2 text-base md:text-lg font-semibold text-gray-600">Time</th>
            <th class="text-left py-3 px-2 text-base md:text-lg font-semibold text-gray-600">Name</th>
            <th class="text-right py-3 px-2 text-base md:text-lg font-semibold text-gray-600">Number</th>
          </tr>
        </thead>
        <tbody id="results-table-body">
          <!-- JS will populate this -->
          <tr><td colspan="3" class="text-center py-8">Loading results...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer class="max-w-2xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">
    <p>&copy; 2025 Nagaland Lottery Results. All rights reserved.</p>
    <p class="mt-1">This is not an official website. Please verify results with official sources.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const resultsTableBody = document.getElementById('results-table-body');
      const resultsDate = document.getElementById('results-date');

      fetch('/data/today.json')
        .then(response => response.json())
        .then(data => {
          // Clear loading state
          resultsTableBody.innerHTML = '';

          // Update date heading
          const date = new Date(data.date + 'T00:00:00');
          const formattedDate = date.toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
          resultsDate.textContent = `Today's Results: ${formattedDate}`;

          // Populate table
          data.draws.forEach(draw => {
            const row = document.createElement('tr');
            row.className = 'border-b border-gray-100 last:border-b-0';
            row.innerHTML = `
              <td class="py-4 px-2 text-base md:text-lg font-medium">${draw.time}</td>
              <td class="py-4 px-2 text-base md:text-lg">${draw.name}</td>
              <td class="py-4 px-2 text-xl md:text-2xl font-bold text-red-600 text-right result-number">${draw.number}</td>
            `;
            resultsTableBody.appendChild(row);
          });
        })
        .catch(error => {
          console.error('Error fetching lottery data:', error);
          resultsTableBody.innerHTML = '<tr><td colspan="3" class="text-center py-8 text-red-500">Could not load results. Please try again later.</td></tr>';
        });
    });
  </script>

</body>
</html>
