<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results Archive - Nagaland Lottery Results</title>
  <meta name="description" content="Browse the archive of past Nagaland State Lottery results by date.">
  <script src="https://cdn.tailwindcss.com/3.4.4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-5 flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-800">
        <a href="/">Nagaland Lottery Results</a>
      </h1>
      <nav class="flex items-center space-x-2 md:space-x-4">
        <a href="/" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-base md:text-lg font-medium">Home</a>
        <a href="/archive.html" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-base md:text-lg font-medium text-blue-700">Archive</a>
        <a href="/contact.html" class="px-3 py-2 rounded-lg hover:bg-gray-100 text-base md:text-lg font-medium">Contact</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <section class="text-center mb-8">
      <h2 class="text-3xl md:text-4xl font-bold text-gray-900">Results Archive</h2>
      <p class="text-base md:text-lg text-gray-600 mt-2">Browse past lottery results by date.</p>
    </section>

    <section id="archive-list" class="space-y-6">
      <!-- JS will populate this -->
      <div class="text-center py-10">Loading archive...</div>
    </section>
  </main>

  <footer class="max-w-4xl mx-auto px-4 py-8 text-center text-gray-500 text-sm">
    <p>&copy; 2025 Nagaland Lottery Results. All rights reserved.</p>
    <p class="mt-1">This is an unofficial website. Please verify all results with official sources.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const archiveList = document.getElementById('archive-list');

      fetch('/data/archive.json')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(archive => {
          if (!archive || archive.length === 0) {
            throw new Error('Archive data is empty or not found.');
          }

          // Clear loading state
          archiveList.innerHTML = '';

          // Populate list with a card for each day
          archive.forEach(dailyResult => {
            const date = new Date(dailyResult.date + 'T00:00:00');
            const formattedDate = date.toLocaleDateString('en-US', {
              weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            let drawsHtml = '<p class="text-gray-500">No draw data available for this day.</p>';
            if (dailyResult.draws && dailyResult.draws.length > 0) {
              drawsHtml = dailyResult.draws.map(draw => `
                <li class="flex justify-between items-center py-2 border-b last:border-b-0">
                  <span class="font-semibold text-gray-700">${draw.time}</span>
                  <span class="font-bold text-lg text-red-600">${draw.number}</span>
                </li>
              `).join('');
            }

            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl shadow-lg p-4 md:p-6';
            card.innerHTML = `
              <h3 class="text-xl font-bold text-gray-800 mb-3">${formattedDate}</h3>
              <ul class="space-y-1">${drawsHtml}</ul>
            `;
            archiveList.appendChild(card);
          });
        })
        .catch(error => {
          console.error('Error fetching archive data:', error);
          archiveList.innerHTML = `<div class="text-center py-10 text-red-500">Could not load archive. The file might be empty or missing. Error: ${error.message}</div>`;
        });
    });
  </script>

</body>
</html>
